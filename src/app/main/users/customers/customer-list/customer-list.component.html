<div class="content-wrapper container-xxl p-0">
    <div class="content-body">
        <!-- Admin List -->
        <section class="admins-list-wrapper">
            <!-- Card Header -->
            <div class="card">
                <h5 class="card-header">{{ 'Admins List' | translate }}</h5>
            </div>

            <!-- Loading Spinner -->
            <div *ngIf="isLoading" class="spinner-grow" role="status">
                <span class="sr-only">Loading...</span>
            </div>

            <!-- Main Card -->
            <div *ngIf="!isLoading" class="card">
                <div class="row p-2">
                    <!-- Show Entries -->
                    <div class="col-md-6 col-12">
                        <div class="d-flex justify-content-between align-items-center m-1">
                            <label class="flex items-center">{{ "SHOW" | translate }}
                                <select class="form-control mx-25" [(ngModel)]="selectedOption">
                                    <option value="10">10</option>
                                    <option value="25">25</option>
                                    <option value="50">50</option>
                                    <option value="100">100</option>
                                </select>
                                {{ "ENTRIES" | translate }}
                            </label>
                        </div>
                    </div>
                    <!-- Search Input -->
                    <div class="col-md-6 col-12 d-flex justify-content-start justify-content-md-end">
                        <div class="flex items-center justify-content-end">
                            <label class="flex items-center m-2 ml-md-0">{{ "SEARCH" | translate }}:</label>
                            <input [(ngModel)]="searchValue" name="searchValue" type="search" class="form-control"
                                (keyup)="filterUpdate($event)" (search)="filterUpdate($event)" />
                            <!-- Add New Button -->
                            <button class="btn btn-primary m-2 col-4" rippleEffect (click)="addItem()">
                                {{ "ADD_NEW" | translate }}
                            </button>
                        </div>
                    </div>
                </div>

                <!-- View Table -->
                <ngx-datatable [rows]="rows" [rowHeight]="50" class="bootstrap core-bootstrap" [limit]="selectedOption"
                    [columnMode]="ColumnMode.force" [headerHeight]="50" [footerHeight]="50" [scrollbarH]="true">

                    <!-- ID -->
                    <ngx-datatable-column name="#" prop="id" [width]="50">
                        <ng-template let-row="row" let-name="value" ngx-datatable-cell-template>
                            <div class="flex items-center">
                                {{ row.id }}
                            </div>
                        </ng-template>
                    </ngx-datatable-column>

                    <!-- Image -->
                    <ngx-datatable-column name="{{ 'IMAGE' | translate }}" prop="imageUrl" [width]="50">
                        <ng-template let-row="row" let-name="value" ngx-datatable-cell-template>
                            <div class="flex items-center">
                                <img class="rounded-circle mr-1" src="{{ row.image }}" height="32" width="32"
                                    alt="datatable-avatar" />
                            </div>
                        </ng-template>
                    </ngx-datatable-column>

                    <!-- Name -->
                    <ngx-datatable-column name="{{ 'NAME' | translate }}" prop="name">
                        <ng-template let-row="row" let-name="value" ngx-datatable-cell-template>
                            <div class="flex items-center">
                                {{ row.firstName }} {{ row.lastName}}
                            </div>
                        </ng-template>
                    </ngx-datatable-column>

                    <!-- Phone Number -->
                    <ngx-datatable-column name="{{ 'PHONE_NUMBER' | translate }}" prop="title">
                        <ng-template let-row="row" let-name="value" ngx-datatable-cell-template>
                            <div class="flex items-center">
                                {{ row.phone }}
                            </div>
                        </ng-template>
                    </ngx-datatable-column>


                    <!-- Status -->
                    <ngx-datatable-column name="{{ 'ACTIVE' | translate }}" prop="status">
                        <ng-template let-row="row" let-name="value" ngx-datatable-cell-template>
                            <div *ngIf="row.accountStatus == 1" class="badge badge-light-danger">
                                {{ 'DISABLED' | translate }}
                            </div>
                            <div *ngIf="row.accountStatus == 2" class="badge badge-light-primary">
                                {{ 'APPROVED' | translate }}
                            </div>
                            <div *ngIf="row.accountStatus == 3" class="badge badge-light-danger">
                                {{ 'BLOCKED' | translate }}
                            </div>
                        </ng-template>
                    </ngx-datatable-column>

                    <!-- isResidential -->
                    <ngx-datatable-column name="{{ 'Is Residential' | translate }}" prop="status">
                        <ng-template let-row="row" let-name="value" ngx-datatable-cell-template>
                            <div *ngIf="row.isResidential == true" class="badge badge-light-info">
                                {{ 'Yes' | translate }}
                            </div>
                            <div *ngIf="row.isResidential !== true" class="badge badge-light-danger">
                                {{ 'No' | translate }}
                            </div>
                        </ng-template>
                    </ngx-datatable-column>

                    <!-- IsEmployee -->
                    <ngx-datatable-column name="{{ 'Is Employee' | translate }}" prop="status">
                        <ng-template let-row="row" let-name="value" ngx-datatable-cell-template>
                            <div *ngIf="row.isEmployee == true" class="badge badge-light-info">
                                {{ 'Yes' | translate }}
                            </div>
                            <div *ngIf="row.isEmployee !== true" class="badge badge-light-danger">
                                {{ 'No' | translate }}
                            </div>
                        </ng-template>
                    </ngx-datatable-column>

                    <!-- Actions -->
                    <ngx-datatable-column name="{{ 'ACTIONS' | translate }}" [sortable]="false" [width]="180">
                        <ng-template ngx-datatable-cell-template let-row="row">
                            <div class="row">
                                <!-- View Action -->
                                <button (click)="editItem(row)" class="btn btn-flat-secondary" rippleEffect>
                                    <span [data-feather]="'eye'"></span>
                                </button>
                                <!-- Edit Action -->
                                <button (click)="editItem(row)" class="btn btn-flat-secondary" rippleEffect>
                                    <span [data-feather]="'edit'"></span>
                                </button>
                                <!-- Delete Action -->
                                <button class="btn btn-flat-danger" rippleEffect (click)="ConfirmDelete(row.id)">
                                    <span [data-feather]="'trash'"></span>
                                </button>
                            </div>
                        </ng-template>
                    </ngx-datatable-column>

                </ngx-datatable>
            </div>
        </section>
        <!-- Student List -->
    </div>
</div>
