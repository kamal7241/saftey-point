<!-- Screen Header -->
<div class="card">
    <h5 class="card-header">{{ 'ADD_GATE' | translate }}</h5>
</div>
<!-- Screen Header -->

<!-- Loading Spinner -->
<div *ngIf="isLoading" class="spinner-grow" role="status">
    <span class="sr-only">{{ 'LOADING' | translate }}...</span>
</div>

<!-- Form -->
<form class="card p-4" *ngIf="!isLoading" [formGroup]="currentForm" (ngSubmit)="onSubmit()">
    <!-- Form Fields -->
    <div class="row">

        <!-- First Name -->
        <div class="form-group col-md-6 col-12">
            <label for="firstName">{{ 'FIRST_NAME' | translate }}</label>
            <input type="text" id="firstName" class="form-control" formControlName="firstName" required />
            <small *ngIf="currentForm.get('firstName').hasError('required') && currentForm.get('firstName').touched"
                class="form-text text-danger">{{ 'REQUIRED_FIELD' | translate }}</small>
        </div>

        <!-- Last Name -->
        <div class="form-group col-md-6 col-12">
            <label for="lastName">{{ 'LAST_NAME' | translate }}</label>
            <input type="text" id="lastName" class="form-control" formControlName="lastName" required />
            <small *ngIf="currentForm.get('lastName').hasError('required') && currentForm.get('lastName').touched"
                class="form-text text-danger">{{ 'REQUIRED_FIELD' | translate }}</small>
        </div>

        <!-- Phone -->
        <div class="form-group col-md-6 col-12">
            <label for="phone">{{ 'PHONE' | translate }}</label>
            <input type="text" id="phone" class="form-control" formControlName="phone" required />
            <small *ngIf="currentForm.get('phone').hasError('required') && currentForm.get('phone').touched"
                class="form-text text-danger">{{ 'REQUIRED_FIELD' | translate }}</small>
        </div>

        <!-- Email -->
        <div class="form-group col-md-6 col-12">
            <label for="email">{{ 'EMAIL' | translate }}</label>
            <input type="email" id="email" class="form-control" formControlName="email" required />
            <small *ngIf="currentForm.get('email').hasError('required') && currentForm.get('email').touched"
                class="form-text text-danger">{{ 'REQUIRED_FIELD' | translate }}</small>
        </div>

        <!-- Password -->
        <div class="form-group col-md-6 col-12">
            <label for="password">{{ 'PASSWORD' | translate }}</label>
            <input type="password" id="password" class="form-control" formControlName="password" />
        </div>

        <!-- Account Status -->
        <div class="form-group col-md-6 col-12">
            <label class="form-label" for="accountStatus">{{ 'STATUS' | translate }}</label>
            <select id="accountStatus" class="form-control" formControlName="accountStatus">
                <option [value]="1">{{ 'DISABLED' | translate }}</option>
                <option [value]="2">{{ 'APPROVED' | translate }}</option>
            </select>
            <small
                *ngIf="currentForm.get('accountStatus').hasError('required') && currentForm.get('accountStatus').touched"
                class="form-text text-danger">{{ 'REQUIRED_FIELD' | translate }}</small>
        </div>

        <!-- Is Residential -->
        <div class="form-group col-md-6 col-12">
            <label>{{ 'IS_RESIDENTIAL' | translate }}</label>
            <div>
                <label>
                    <input type="radio" formControlName="isResidential" [value]="true" /> {{ 'YES' | translate }}
                </label>
                <label>
                    <input type="radio" formControlName="isResidential" [value]="false" /> {{ 'NO' | translate }}
                </label>
            </div>
        </div>


        <!-- Is Employee -->
        <div class="form-group col-md-6 col-12">
            <label>{{ 'IS_EMPLOYEE' | translate }}</label>
            <div>
                <label>
                    <input type="radio" formControlName="isEmployee" [value]="true" /> {{ 'YES' | translate }}
                </label>
                <label>
                    <input type="radio" formControlName="isEmployee" [value]="false" /> {{ 'NO' | translate }}
                </label>
            </div>
        </div>

        <!-- Upload File -->
        <div class="form-group col-md-6 col-12">
            <fieldset class="form-group">
                <label for="file-upload-single">{{ 'SELECT_IMAGE' | translate }}</label>
                <div class="custom-file">
                    <input type="file" accept="image/*" class="custom-file-input" (change)="onFileSelected($event)"
                        id="file-upload-single" />
                    <label class="custom-file-label">{{ 'CHOOSE_FILE' | translate }}</label>
                </div>
            </fieldset>
            <div *ngIf="selectedFile">
                <img [src]="selectedFile || 'image'" alt="{{ 'IMAGE' | translate }}"
                    style="width: 200px; height: 200px;" />
                <button type="button" class="btn btn-danger btn-sm round m-1" rippleEffect (click)="deleteImage()">
                    <i class="feather icon-x"></i>
                </button>
            </div>
            <small *ngIf="currentForm.get('image').hasError('required') && !selectedFile" class="form-text text-danger">
                {{ 'REQUIRED_FIELD' | translate }}
            </small>
        </div>

    </div>
</form>

<!-- Actions -->
<div>
    <button type="submit" rippleEffect class=" btn btn-primary col-3 mr-2" (click)="onSubmit()">
        {{ 'SUBMIT' | translate }}
    </button>
    <button type="reset" rippleEffect class="btn btn-outline-secondary col-3" (click)="back()">
        {{ 'CANCEL' | translate }}
    </button>
</div>
