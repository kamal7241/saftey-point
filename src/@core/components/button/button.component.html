<button
  [type]="type"
  [ngClass]="buttonClasses"
  class="flex gap-2 justify-center items-center transition-all"
  (click)="onClick()"
>
  <!-- If an icon is provided, display it -->
  <img *ngIf="icon" [src]="icon" alt="Icon" class="w-5 h-5" />

  <!-- Button label -->
  <span>{{ label }}</span>
</button>
