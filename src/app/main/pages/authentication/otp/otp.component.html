<div class="flex min-h-screen items-center justify-center bg-gray-100 py-20">
  <div
    class="mx-auto flex w-full max-w-6xl overflow-hidden rounded-2xl bg-white"
  >
    <div class="h-[824px] w-1/2">
      <div class="h-full px-14 pb-6 pt-20">
        <div class="flex h-full flex-col items-center justify-center gap-4">
          <img
            [src]="'assets/images/logo/logo.webp'"
            alt="Logo"
            width="138"
            height="158"
          />
          <h2 class="text-center text-2xl font-medium leading-6 text-primary">
            Enter Verification Code
          </h2>
          <p class="text-center text-black">
            Enter the code we sent to the email <br />
            {{ "Michxxx@gmail.com" }}
          </p>
          <form
            [formGroup]="otpForm"
            (ngSubmit)="onSubmit()"
            class="flex w-full flex-col gap-4"
          >
            <div class="flex justify-center gap-2">
              <input
                #otpInput
                *ngFor="let code of codes; let i = index"
                type="text"
                maxlength="1"
                [formControlName]="'code' + i"
                class="h-12 w-12 rounded border border-gray-300 text-center"
                (input)="onInput($event, i)"
              />
            </div>
            <button
              type="submit"
              class="mt-3 w-full rounded-lg bg-primary py-3 text-center text-white transition-all hover:bg-primaryLight"
            >
              Verify Code
            </button>
            <p *ngIf="timerText" class="mt-6 text-center">{{ timerText }}</p>
            <a
              *ngIf="canResend"
              class="mt-6 inline-block text-center hover:underline"
              (click)="resendCode()"
              role="button"
              >Resend Code</a
            >
          </form>
          <a
            href="/pages/authentication/forget-password"
            class="mt-auto flex items-center gap-4 transition-all hover:gap-6"
          >
            <img [src]="'assets/images/icons/arrow-left.svg'" width="24" />
            Back to Forget Password</a
          >
        </div>
      </div>
    </div>
    <div class="relative w-1/2 overflow-hidden rounded-l-4xl">
      <img
        class="absolute inset-0 h-full w-full object-cover"
        [src]="'assets/images/pages/otp.webp'"
        alt="OTP Image"
      />
    </div>
  </div>
</div>
