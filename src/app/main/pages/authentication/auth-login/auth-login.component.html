<div class="flex justify-center items-center py-20 min-h-screen bg-gray-100">
  <div
    class="flex overflow-hidden mx-auto w-full max-w-6xl bg-white rounded-2xl"
  >
    <div class="px-14 pt-20 w-1/2">
      <div class="flex flex-col gap-4 justify-center items-center">
        <img
          class=""
          [src]="'assets/images/logo/logo.webp'"
          alt="Logo"
          width="138"
          height="158"
        />
        <h2 class="text-2xl font-medium leading-6 text-center text-primary">
          Aiming to supply our customers all solutions needed during operation
        </h2>
        <p class="text-center text-black">
          Welcome back! Please login to your account.
        </p>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <app-input-with-label
            label="Username"
            type="text"
            placeholder="Enter your username"
            formControlName="username"
            [required]="true"
            icon="assets/images/icons/user.svg"
          ></app-input-with-label>
        </form>
      </div>
    </div>
    <div class="overflow-hidden relative w-1/2 rounded-l-4xl">
      <img
        class="object-cover absolute inset-0 w-full h-full"
        [src]="'assets/images/pages/login.webp'"
        alt="Login Image"
      />
    </div>
  </div>
</div>
