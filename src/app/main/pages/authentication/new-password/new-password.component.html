<div class="flex min-h-screen items-center justify-center bg-gray-100 py-20">
  <div class="mx-auto flex w-full max-w-6xl overflow-hidden rounded-2xl bg-white">
    <div class="h-[824px] w-1/2">
      <div class="px-14 pt-20">
        <div class="flex flex-col items-center justify-center gap-4">
          <img
            class="" [src]="'assets/images/logo/logo.webp'"
            alt="Logo"
            width="138"
            height="158"
          />
          <h2 class="text-center text-2xl font-medium leading-6 text-primary">
            Reset Your Password
          </h2>
          <p class="text-center text-black">
            Please enter your new password below.
          </p>
          <form
            [formGroup]="passwordForm"
            (ngSubmit)="onSubmit()"
            class="flex w-full flex-col gap-4"
          >
            <app-input-with-label
              label="New Password"
              type="password"
              placeholder="New Password"
              formControlName="newPassword"
              [required]="true"
              icon="assets/images/icons/lock.svg"
            ></app-input-with-label>
            <app-input-with-label
              label="Confirm Password"
              type="password"
              placeholder="Confirm Password"
              formControlName="confirmPassword"
              [required]="true"
              icon="assets/images/icons/lock.svg"
            ></app-input-with-label>
            
            <div *ngIf="errorMessage" class="text-center text-red-500">
              {{ errorMessage }}
            </div>

            <button
              type="submit"
              [disabled]="loading"
              class="mt-3 w-full rounded-lg bg-primary py-3 text-center text-white transition-all hover:bg-primaryLight"
            >
              <span *ngIf="loading">Please wait...</span>
              <span *ngIf="!loading">Update Password</span>
            </button>
          </form>
        </div>
      </div>
    </div>
    <div class="relative w-1/2 overflow-hidden rounded-l-4xl">
      <img
        class="absolute inset-0 h-full w-full object-cover"
        [src]="'assets/images/pages/reset-password.webp'"
        alt="Reset Password"
      />
    </div>
  </div>
</div>
