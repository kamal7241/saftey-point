<div class="content-wrapper container-xxl p-0">
  <div class="content-body">
    <!-- Organization List -->
    <section class="organizations-list-wrapper">
      <!-- Card Header -->
      <div class="card pb-3 pr-3 pl-3">
        <h5 class="card-header">{{ 'Organization Details' | translate }}</h5>

        <ul ngbNav #navJustified="ngbNav" class="nav nav-pills nav-justified bg-light-info">

          <!-- Organization Overview -->
          <li ngbNavItem>
            <a ngbNavLink>Overview</a>
            <ng-template ngbNavContent>
              <app-organization-overview></app-organization-overview>
            </ng-template>
          </li>

          <!-- Organization Courses -->
          <li ngbNavItem>
            <a ngbNavLink>Courses</a>
            <ng-template ngbNavContent>
              <app-course-list [selectedCenterId]="1" [hasHeader]="false"></app-course-list>
            </ng-template>
          </li>

          <!-- Organization Instructors -->
          <li ngbNavItem>
            <a ngbNavLink>Instructors</a>
            <ng-template ngbNavContent>
              <app-teacher-list [selectedCenterId]="1" [hasHeader]="false"></app-teacher-list>
            </ng-template>
          </li>


          <!-- Organization Enrollments -->
          <li ngbNavItem>
            <a ngbNavLink>Enrolments</a>
            <ng-template ngbNavContent>
              <p>
                Enrolments is coming Soon!
              </p>
            </ng-template>
          </li>

          <!-- Organization Payout Requests -->
          <li ngbNavItem>
            <a ngbNavLink>Payout Requests</a>
            <ng-template ngbNavContent>
              <app-payout-requests-list [selectedCenterId]="1" [hasHeader]="false"></app-payout-requests-list>
            </ng-template>
          </li>

        </ul>
      </div>

      <!-- Loading Spinner -->
      <div *ngIf="isLoading" class="spinner-grow" role="status">
        <span class="sr-only">Loading...</span>
      </div>

      <div [ngbNavOutlet]="navJustified" class="mt-1"></div>


    </section>
  </div>
</div>
